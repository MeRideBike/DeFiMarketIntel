services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: defi-market-intel:local
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MARKET_PROVIDER_TIMEOUT_MS: ${MARKET_PROVIDER_TIMEOUT_MS:-8000}
      DEFILLAMA_API_BASE_URL: ${DEFILLAMA_API_BASE_URL:-https://coins.llama.fi}
      DEXSCREENER_API_BASE_URL: ${DEXSCREENER_API_BASE_URL:-https://api.dexscreener.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-defi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-defi_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-defi_market_intel}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-defi} -d ${POSTGRES_DB:-defi_market_intel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
